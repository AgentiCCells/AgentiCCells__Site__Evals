name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take the security checks from the trusted base (fail closed)
        # Every security check (trailers, signatures, leak scan, and the config they read) runs from the
        # trusted base's copy, never from the pushed tree, with no fallback (security@, 2026-11-19).
        # The base is the last release tag; without one, the push's "before". Nothing from the
        # environment can override it.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          base=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$AFTER" 2>/dev/null || true)
          if [ -z "$base" ] && [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -Eq '^0+$'; then base="$BEFORE"; fi
          git rev-parse --verify --quiet "${base:-none}^{commit}" >/dev/null || { echo "no trusted base" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/trusted" .ci-trusted
          for f in check-commits.mjs check-signatures.mjs; do
            git show "$base:scripts/$f" > "$RUNNER_TEMP/trusted/$f" || { echo "no $f at $base" >&2; exit 1; }
          done
          # The leak scan finds the repository from its own path (its parent directory), so it sits one level down.
          git show "$base:scripts/leak-scan.mjs" > .ci-trusted/leak-scan.mjs || { echo "no leak-scan.mjs at $base" >&2; exit 1; }
          echo "TRUSTED_BASE=$(git rev-parse "$base")" >> "$GITHUB_ENV"
      - name: Every commit since the base carries an Agent trailer (trusted copy)
        run: node "$RUNNER_TEMP/trusted/check-commits.mjs" "$TRUSTED_BASE" "$GITHUB_SHA"
      - name: Every commit since the base is signed by a key in its parent's team/keys.json (trusted copy)
        run: node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$TRUSTED_BASE" "$GITHUB_SHA"
      - name: Self-tests of the checks in this push
        run: |
          node scripts/test-signatures.mjs
          node scripts/test-commits.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Core tests
        run: node scripts/test-core.mjs
      - name: Leak scan of tracked files and the built site (trusted copy)
        run: node .ci-trusted/leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
