name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take the security checks from anchor A (fail closed)
        # security@'s fourth ruling (2026-11-19, relayed by cells.b@): anchor A is the newest commit a
        # passing run verified, read from a record a pusher cannot write: the sha of the last successful
        # github-pages deployment, from the deployments API with this run's own token. Tags are not used.
        # A must be an ancestor of AFTER. Every commit in A..AFTER is checked (so commits from dropped runs
        # are covered), with every check and its config taken from A's tree. Fail if A, or a check at A,
        # is missing. Tested by scripts/test-ci-trusted.mjs, which runs this step's script.
        env:
          AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          fail() { echo "trusted checks: $*" >&2; exit 1; }
          api() { curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"; }
          deps=$(api "deployments?environment=github-pages&per_page=30") || fail "cannot read the deployments: refused"
          A=""
          for line in $(printf '%s' "$deps" | jq -r '.[] | "\(.id):\(.sha)"'); do
            state=$(api "deployments/${line%%:*}/statuses?per_page=1" | jq -r '.[0].state // ""') || fail "cannot read a deployment status: refused"
            if [ "$state" = "success" ]; then A="${line#*:}"; break; fi
          done
          [ -n "$A" ] || fail "no successful github-pages deployment to anchor on: refused"
          git rev-parse --verify --quiet "$A^{commit}" >/dev/null || fail "anchor A $A is not in this history: refused"
          git merge-base --is-ancestor "$A" "$AFTER" || fail "anchor A is not an ancestor of AFTER: refused"
          trusted="${RUNNER_TEMP}/trusted"; mkdir -p "$trusted" .ci-trusted
          for f in check-commits.mjs check-signatures.mjs; do
            git show "$A:scripts/$f" > "$trusted/$f" 2>/dev/null || fail "no $f at anchor A: refused"
          done
          # The leak scan finds the repository from its own path (its parent directory), so it sits one level down.
          git show "$A:scripts/leak-scan.mjs" > .ci-trusted/leak-scan.mjs 2>/dev/null || fail "no leak-scan.mjs at anchor A: refused"
          echo "TRUSTED_START=$(git rev-parse "$A")" >> "$GITHUB_ENV"
      - name: Every commit since the start carries an Agent trailer (copy from A)
        run: node "$RUNNER_TEMP/trusted/check-commits.mjs" "$TRUSTED_START" "$GITHUB_SHA"
      - name: Every commit since the start is signed by a key in its parent's team/keys.json (copy from A)
        run: node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$TRUSTED_START" "$GITHUB_SHA"
      - name: Self-tests of the checks in this push
        run: |
          node scripts/test-signatures.mjs
          node scripts/test-commits.mjs
          node scripts/test-ci-trusted.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Core tests
        run: node scripts/test-core.mjs
      - name: Leak scan of tracked files and the built site (copy from A)
        run: node .ci-trusted/leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
