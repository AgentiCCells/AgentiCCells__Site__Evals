name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Take the security checks from BEFORE (fail closed)
        # security@'s third ruling (2026-11-19, relayed by cells.b@): every security check (trailers,
        # signatures, leak scan, and the config they read) runs from BEFORE, the commit dev pointed to
        # before this push, which was itself checked. Fail if BEFORE is missing or zero, is not an ancestor
        # of AFTER (a force push), or has no copy of a check; never fall back to another copy. Commits are
        # checked from the last release tag that is an ancestor of BEFORE (so a dropped run is covered),
        # or from BEFORE. Nothing from the environment can override BEFORE. Tested by
        # scripts/test-ci-trusted.mjs, which runs this step's script.
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          fail() { echo "trusted checks: $*" >&2; exit 1; }
          case "${BEFORE:-}" in ''|*[!0-9a-f]*) fail "no BEFORE commit (a new branch or a manual run): refused";; esac
          echo "$BEFORE" | grep -Eqv '^0+$' || fail "BEFORE is zero: refused"
          git rev-parse --verify --quiet "$BEFORE^{commit}" >/dev/null || fail "BEFORE $BEFORE is not in this history"
          git merge-base --is-ancestor "$BEFORE" "$AFTER" || fail "BEFORE is not an ancestor of AFTER (a force push): refused"
          start=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$BEFORE" 2>/dev/null || true)
          if [ -n "$start" ]; then git merge-base --is-ancestor "$start" "$BEFORE" || start=""; fi
          start=$(git rev-parse "${start:-$BEFORE}")
          trusted="${RUNNER_TEMP}/trusted"; mkdir -p "$trusted" .ci-trusted
          for f in check-commits.mjs check-signatures.mjs; do
            git show "$BEFORE:scripts/$f" > "$trusted/$f" 2>/dev/null || fail "no $f at BEFORE: refused"
          done
          # The leak scan finds the repository from its own path (its parent directory), so it sits one level down.
          git show "$BEFORE:scripts/leak-scan.mjs" > .ci-trusted/leak-scan.mjs 2>/dev/null || fail "no leak-scan.mjs at BEFORE: refused"
          echo "TRUSTED_START=$start" >> "$GITHUB_ENV"
      - name: Every commit since the start carries an Agent trailer (copy from BEFORE)
        run: node "$RUNNER_TEMP/trusted/check-commits.mjs" "$TRUSTED_START" "$GITHUB_SHA"
      - name: Every commit since the start is signed by a key in its parent's team/keys.json (copy from BEFORE)
        run: node "$RUNNER_TEMP/trusted/check-signatures.mjs" "$TRUSTED_START" "$GITHUB_SHA"
      - name: Self-tests of the checks in this push
        run: |
          node scripts/test-signatures.mjs
          node scripts/test-commits.mjs
          node scripts/test-ci-trusted.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: Core tests
        run: node scripts/test-core.mjs
      - name: Leak scan of tracked files and the built site (copy from BEFORE)
        run: node .ci-trusted/leak-scan.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
